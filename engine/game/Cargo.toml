[package]
name = "molehill"
version = "0.3.0"
edition = "2021"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d", "ui"] }
molehill-sim = { path = "../sim", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
molehill-sim = { path = "../sim", features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
