[workspace]
resolver = "2"
members = ["sim", "game", "tools/cave-editor"]
# `cargo build` / `cargo run` without -p build the game only. The cave editor (tools/cave-editor) is a
# dev tool: never a default member, never a dependency of the game, never in build-web.sh or site/.
default-members = ["sim", "game"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
debug = false
