<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molehill</title>
<style>html,body{margin:0;height:100%;background:#0b0a0d;overflow:hidden;font-family:system-ui,sans-serif}
#bevy{width:100%;height:100%;display:block;outline:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#d9cfbf;font-size:18px;pointer-events:none}</style></head>
<body><canvas id="bevy" tabindex="0"></canvas><div id="load">Digging in… (loading engine)</div>
<script type="module">
import init from './molehill.js';
init().catch(e => { if (!String(e).includes('Using exceptions for control flow')) { document.getElementById('load').textContent = 'Failed to start: ' + e; throw e; } });
const t = setInterval(() => { if (document.querySelector('#bevy').width > 300) { document.getElementById('load').remove(); clearInterval(t); document.getElementById('bevy').focus(); } }, 300);
</script></body></html>
