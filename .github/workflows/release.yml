# Release builds of the native game. GitHub-hosted runners only.
# - workflow_dispatch: build all three OSes and upload them as run artifacts (a dry run).
# - workflow_call: the same, from deploy-site.yml (what: binaries or both).
# - push of a tag v*: the same builds, then a GitHub Release with the archives attached.
# Every asset (font, site templates) is compiled into the binary and sound is synthesised (cpal),
# so each archive is just the binary plus the README.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build arm64 and x86_64
        working-directory: engine
        run: |
          cargo build --release --locked -p molehill --target aarch64-apple-darwin
          cargo build --release --locked -p molehill --target x86_64-apple-darwin
      - name: Universal binary and zip
        run: |
          name="molehill-macos-universal"
          mkdir -p "out/$name"
          lipo -create -output "out/$name/molehill" \
            engine/target/aarch64-apple-darwin/release/molehill \
            engine/target/x86_64-apple-darwin/release/molehill
          lipo -info "out/$name/molehill"
          cp README.md "out/$name/"
          (cd out && zip -r "$name.zip" "$name")
          echo "ASSET=out/$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.ASSET }}
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build
        working-directory: engine
        run: cargo build --release --locked -p molehill
      - name: Zip
        shell: pwsh
        run: |
          $name = "molehill-windows-x86_64"
          New-Item -ItemType Directory -Force "out/$name" | Out-Null
          Copy-Item engine/target/release/molehill.exe "out/$name/"
          Copy-Item README.md "out/$name/"
          Compress-Archive -Path "out/$name" -DestinationPath "out/$name.zip"
          "ASSET=out/$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.ASSET }}
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (ALSA for sound, udev, X11 and Wayland for winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build
        working-directory: engine
        run: cargo build --release --locked -p molehill
      - name: Tarball
        run: |
          name="molehill-linux-x86_64"
          mkdir -p "out/$name"
          cp engine/target/release/molehill README.md "out/$name/"
          tar -C out -czf "out/$name.tar.gz" "$name"
          echo "ASSET=out/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Unsigned builds. Unzip and run `molehill` (macOS, Linux) or `molehill.exe` (Windows).
            macOS: the first time, right-click the binary and choose Open (or run `xattr -d com.apple.quarantine molehill`).
            Windows: SmartScreen may warn about an unknown publisher; choose More info, then Run anyway.
            Saves (`molehill-auto`, `molehill-manual`) go in the folder the game starts in: your home folder when the binary is double-clicked on macOS.
